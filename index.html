<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Griechisches Live TV – Proxy Modus</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }

        .menu {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: #0056b3;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover, .btn:focus {
            background: #007bff;
            outline: 3px solid #fff;
        }

        .btn.active {
            background: #28a745;
        }

        /* Ein einheitlicher Container für das Iframe */
        iframe {
            width: 95%;
            height: 80vh;
            border: none;
            background: black;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="menu">
        <button class="btn" id="btn-ant1" onclick="loadChannel('ant1')">ANT1 HD</button>
        <button class="btn" id="btn-mega" onclick="loadChannel('mega')">MEGA Life</button>
        <!-- Dieser Button öffnet den funktionierenden Stream direkt in deinem VLC Player! -->
        <button class="btn" id="btn-ant1free" onclick="openInVLC()">Ant1free (VLC Player)</button>
    </div>

    <!-- Container für Webseiten-Modus (ANT1 HD / MEGA Life) -->
    <iframe id="tvframe"></iframe>

    <script>
        // Dein Vercel Proxy-Prefix für reguläre Webseiten
        const proxyPrefix = window.location.origin + "/api/proxy?url=";

        const channels = {
            ant1: "https://antenna.gr",
            mega: "https://megatv.com"
        };

        // Funktion für die normalen Webseiten im Iframe
        function loadChannel(channelKey) {
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            const activeButton = document.getElementById(`btn-${channelKey}`);
            if (activeButton) {
                activeButton.classList.add('active');
            }

            const targetUrl = channels[channelKey];
            const iframe = document.getElementById('tvframe');

            if (targetUrl) {
                iframe.src = proxyPrefix + encodeURIComponent(targetUrl);
            }
        }

        // KORREKTUR: Diese Funktion übergibt den funktionierenden Link direkt an deinen VLC Player auf dem PC!
        function openInVLC() {
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-ant1free').classList.add('active');

            const streamUrl = "https://antennaplus.gr";
            
            // Nutzt das standardmäßige Protokoll, um externe Mediaplayer/VLC zu triggern
            window.location.href = "vlc://" + streamUrl;

            // Fallback: Falls die vlc:// Verknüpfung nicht eingerichtet ist, öffnet sich ein neues Fenster
            setTimeout(() => {
                alert("Der Stream wurde an deinen VLC Player gesendet!\n\nFalls VLC nicht startet, öffne den VLC Player, drücke Strg+N und füge dort die URL ein:\n" + streamUrl);
            }, 1000);
        }
    </script>
</body>
</html>
