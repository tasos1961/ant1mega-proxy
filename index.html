<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Griechisches Live TV – Proxy Modus</title>
    <!-- Neue, stabile Skript-Quelle (cdnjs), da jsdelivr bei dir blockiert/abgelaufen ist -->
    <script src="https://cloudflare.com"></script>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }

        .menu {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: #0056b3;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover, .btn:focus {
            background: #007bff;
            outline: 3px solid #fff;
        }

        .btn.active {
            background: #28a745;
        }

        iframe, video {
            width: 95%;
            height: 80vh;
            border: none;
            background: black;
            border-radius: 8px;
        }

        #tvvideo {
            display: none;
            height: auto;
            max-width: 1280px;
        }
    </style>
</head>
<body>

    <div class="menu">
        <button class="btn" id="btn-ant1" onclick="loadChannel('ant1')">ANT1 HD</button>
        <button class="btn" id="btn-mega" onclick="loadChannel('mega')">MEGA Life</button>
        <button class="btn" id="btn-ant1free" onclick="loadChannel('ant1free')">Ant1free</button>
    </div>

    <iframe id="tvframe"></iframe>

    <video id="tvvideo" controls autoplay muted></video>

    <script>
        const proxyPrefix = window.location.origin + "/api/proxy?url=";

        // const channels = {
            // ant1: "https://antenna.gr",
           // mega: "https://megatv.com",
           // ant1free: "https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1.m3u8"
        //};

                // Wir nutzen einen freien CORS-Proxy für den Direktstream, um Vercel zu umgehen
                // Ant1free nutzt nun corsproxy.io + den stabilen internationalen Stream
        const channels = {
            ant1: "https://antenna.gr",
            mega: "https://megatv.com",
            ant1free: "https://corsproxy.io?" + encodeURIComponent("https://antenna.gr")
        };



        let hlsInstance = null;

        function loadChannel(channelKey) {
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            const activeButton = document.getElementById(`btn-${channelKey}`);
            if (activeButton) {
                activeButton.classList.add('active');
            }

            const targetUrl = channels[channelKey];
            const iframe = document.getElementById('tvframe');
            const video = document.getElementById('tvvideo');

            if (!targetUrl) return;

            // Für ant1free nutzen wir direkt den externen corsproxy, für andere Kanäle deinen Vercel-Proxy
            // ... Deine Zeile 93 steht direkt hier drüber ...
            const proxiedUrl = (channelKey === 'ant1free') ? targetUrl : proxyPrefix + encodeURIComponent(targetUrl);

            if (channelKey === 'ant1free') {
                iframe.style.display = 'none';
                iframe.src = ''; 
                video.style.display = 'block';

                if (hlsInstance) {
                    hlsInstance.destroy();
                }

                if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(proxiedUrl);
                    hlsInstance.attachMedia(video);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play().catch(e => console.log("Autoplay blockiert:", e));
                    });
                } 
                else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = proxiedUrl;
                    video.addEventListener('loadedmetadata', function() {
                        video.play().catch(e => console.log("Autoplay blockiert:", e));
                    });
                } else {
                    alert("Dein Browser unterstützt diesen Stream-Typ leider nicht.");
                }
            } else {
                if (hlsInstance) {
                    hlsInstance.destroy();
                    hlsInstance = null;
                }
                video.pause();
                video.src = '';
                video.style.display = 'none';
                
                iframe.style.display = 'block';
                iframe.src = proxiedUrl;
            }
        } // <-- Das hier schließt die loadChannel-Funktion ab
    
    </script>
</body>
</html>
