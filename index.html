<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Griechisches Live TV – Proxy Modus</title>
    <!-- Zuverlässige Skript-Quelle für den HLS-Videoplayer geladen von cdnjs -->
    <script src="https://cloudflare.com"></script>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }

        .menu {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: #0056b3;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover, .btn:focus {
            background: #007bff;
            outline: 3px solid #fff;
        }

        .btn.active {
            background: #28a745;
        }

        /* Container für Iframe und Videoplayer */
        iframe, video {
            width: 95%;
            height: 80vh;
            border: none;
            background: black;
            border-radius: 8px;
        }

        /* Standardmäßig ist der Videoplayer unsichtbar */
        #tvvideo {
            display: none;
            height: auto;
            max-width: 1280px;
        }

        /* Lade-Anzeige Text */
        #loadingText {
            display: none;
            font-size: 20px;
            color: #ffc107;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="menu">
        <button class="btn" id="btn-ant1" onclick="loadChannel('ant1')">ANT1 HD</button>
        <button class="btn" id="btn-mega" onclick="loadChannel('mega')">MEGA Life</button>
        <button class="btn" id="btn-ant1free" onclick="loadChannel('ant1free')">Ant1free</button>
    </div>

    <div id="loadingText">Stream wird geladen, bitte warten...</div>

    <!-- Container für Webseiten-Modus (ANT1 HD / MEGA Life) -->
    <iframe id="tvframe"></iframe>

    <!-- Container für direkten M3U8-Videostream (Ant1free) -->
    <video id="tvvideo" controls preload="auto" width="100%"></video>

    <script>
        // Dein eigener Vercel-Proxy
        const proxyPrefix = window.location.origin + "/api/proxy?url=";

        // HIER STEHT JETZT EXAKT DEINE WUNSCH-URL:
        const channels = {
            ant1: "https://antenna.gr",
            mega: "https://megatv.com",
            ant1free: "https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1.m3u8"
        };

        let hlsInstance = null;

        function loadChannel(channelKey) {
            // 1. Visuelles Update der Buttons
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            const activeButton = document.getElementById(`btn-${channelKey}`);
            if (activeButton) {
                activeButton.classList.add('active');
            }

            const targetUrl = channels[channelKey];
            const iframe = document.getElementById('tvframe');
            const video = document.getElementById('tvvideo');
            const loadingText = document.getElementById('loadingText');

            if (!targetUrl) return;

            // 2. Modus-Unterscheidung: Stream-Modus vs. Webseiten-Modus
            if (channelKey === 'ant1free') {
                iframe.style.display = 'none';
                iframe.src = ''; 
                video.style.display = 'block';
                loadingText.style.display = 'block';

                if (hlsInstance) {
                    hlsInstance.destroy();
                }

                if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                    hlsInstance = new Hls({
                        maxMaxBufferLength: 10,
                        // Intelligenter Interceptor: Hls.js berechnet die relativen Pfade korrekt basierend 
                        // auf der Original-URL, aber wir jagen das Endergebnis durch deinen Vercel-Proxy!
                        xhrSetup: function (xhr, url) {
                            if (!url.includes('/api/proxy')) {
                                xhr.open('GET', proxyPrefix + encodeURIComponent(url), true);
                            }
                        }
                    });
                    
                    // Wir füttern Hls.js mit der echten URL, damit die relativen .m3u8-Pfade stimmen
                    hlsInstance.loadSource(targetUrl);
                    hlsInstance.attachMedia(video);
                    
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                        loadingText.style.display = 'none';
                        video.muted = true; // Stummgeschaltet wegen Browser-Vorschriften
                        video.play()
                            .then(() => console.log("Stream gestartet."))
                            .catch(e => console.log("Klicke manuell auf Play, falls blockiert"));
                    });

                    hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                        if (data.fatal) {
                            hlsInstance.startLoad();
                        }
                    });
                } 
                // Native Unterstützung für Apple Safari (iOS / Mac)
                else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = proxyPrefix + encodeURIComponent(targetUrl);
                    video.addEventListener('loadedmetadata', function() {
                        loadingText.style.display = 'none';
                        video.muted = true;
                        video.play().catch(e => console.log("Safari blockiert"));
                    });
                }
            } else {
                // Webseiten-Modus für normale Seiten über den Proxy
                loadingText.style.display = 'none';
                if (hlsInstance) {
                    hlsInstance.destroy();
                    hlsInstance = null;
                }
                video.pause();
                video.src = '';
                video.style.display = 'none';
                
                iframe.style.display = 'block';
                iframe.src = proxyPrefix + encodeURIComponent(targetUrl);
            }
        }
    </script>
</body>
</html>
