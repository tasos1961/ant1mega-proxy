<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Griechisches Live TV – Vidaa TV Modus</title>
    <!-- Zuverlässige Streaming-Bibliothek für den Smart-TV Browser -->
    <script src="https://cloudflare.com"></script>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }

        .menu {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: #0056b3;
            color: white;
            border: none;
            padding: 15px 30px; /* Große Buttons für die TV-Fernbedienung */
            font-size: 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover, .btn:focus {
            background: #007bff;
            outline: 4px solid #fff; /* Fokus-Rahmen für TV-Steuerung */
        }

        .btn.active {
            background: #28a745;
        }

        /* Der Video-Player füllt den TV-Bildschirm perfekt aus */
        video {
            width: 95%;
            max-width: 1280px;
            height: 70vh;
            background: black;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        #loadingText {
            display: none;
            font-size: 22px;
            color: #ffc107;
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="menu">
        <button class="btn" id="btn-ant1free" onclick="loadChannel('ant1free')">ANT1 Free</button>
        <button class="btn" id="btn-megalive" onclick="loadChannel('megalive')">MEGA Live HD</button>
    </div>

    <div id="loadingText">Kanal wird geladen, bitte warten...</div>

    <!-- Ein sauberer Video-Player für deinen Fernseher -->
    <video id="tvvideo" controls preload="auto"></video>

    <script>
        // Ein stabiler Proxy, der die Streams für Smart-TVs freischaltet
        const publicProxy = "https://corsproxy.io";

        // EXAKT DEINE GEWÜNSCHTE MASTER-URL HINTERLEGT:
        const channels = {
            ant1free: "https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1.m3u8",
            megalive: "https://megatv.com"
        };

        let hlsInstance = null;

        function loadChannel(channelKey) {
            // Buttons visuell aktualisieren
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            const activeButton = document.getElementById(`btn-${channelKey}`);
            if (activeButton) {
                activeButton.classList.add('active');
            }

            const targetUrl = channels[channelKey];
            const video = document.getElementById('tvvideo');
            const loadingText = document.getElementById('loadingText');

            if (!targetUrl) return;

            loadingText.style.display = 'block';
            loadingText.innerText = "Verbindung zum Sender wird aufgebaut...";

            if (hlsInstance) {
                hlsInstance.destroy();
            }

            // Wir jagen deine Master-M3U8 durch den Proxy
            const proxiedStreamUrl = publicProxy + encodeURIComponent(targetUrl);

            if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                hlsInstance = new Hls({
                    maxMaxBufferLength: 15,
                    xhrSetup: function (xhr, url) {
                        // KORREKTUR: Wenn Hls.js die relativen Unter-Listen aus deiner Master-M3U8 liest,
                        // fangen wir sie hier ab und tunneln sie ebenfalls automatisch über corsproxy.io
                        if (!url.includes('corsproxy.io')) {
                            xhr.open('GET', publicProxy + encodeURIComponent(url), true);
                        }
                    }
                });
                
                hlsInstance.loadSource(proxiedStreamUrl);
                hlsInstance.attachMedia(video);
                
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    loadingText.style.display = 'none';
                    // Der Stream startet mit Ton
                    video.play().catch(e => {
                        console.log("TV verlangt manuellen Start");
                        loadingText.style.display = 'block';
                        loadingText.innerText = "Bitte drücke auf der Fernbedienung auf PLAY!";
                    });
                });

                hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        hlsInstance.startLoad();
                    }
                });
            } 
            // Fallback für native HLS-Browser
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = proxiedStreamUrl;
                video.addEventListener('loadedmetadata', function() {
                    loadingText.style.display = 'none';
                    video.play();
                });
            }
        }
    </script>
</body>
</html>
