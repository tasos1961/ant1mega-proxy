<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Griechisches Live TV – Proxy Modus</title>
    <!-- Zuverlässige Skript-Quelle für den HLS-Videoplayer geladen von cdnjs -->
    <script src="https://cloudflare.com"></script>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }

        .menu {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: #0056b3;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover, .btn:focus {
            background: #007bff;
            outline: 3px solid #fff;
        }

        .btn.active {
            background: #28a745;
        }

        /* Container für Iframe und Videoplayer */
        iframe, video {
            width: 95%;
            height: 80vh;
            border: none;
            background: black;
            border-radius: 8px;
        }

        /* Standardmäßig ist der Videoplayer unsichtbar */
        #tvvideo {
            display: none;
            height: auto;
            max-width: 1280px;
        }
    </style>
</head>
<body>

    <div class="menu">
        <button class="btn" id="btn-ant1" onclick="loadChannel('ant1')">ANT1 HD</button>
        <button class="btn" id="btn-mega" onclick="loadChannel('mega')">MEGA Life</button>
        <button class="btn" id="btn-ant1free" onclick="loadChannel('ant1free')">Ant1free</button>
    </div>

    <!-- Container für Webseiten-Modus (ANT1 HD / MEGA Life) -->
    <iframe id="tvframe"></iframe>

    <!-- Container für direkten M3U8-Videostream (Ant1free) -->
    <video id="tvvideo" controls autoplay muted></video>

    <script>
        // Dein Vercel Proxy-Prefix für reguläre Webseiten
        const proxyPrefix = window.location.origin + "/api/proxy?url=";

        // Ein intelligenter CORS-Proxy, der Video-Playlists für den Browser lesbar macht
        const streamProxy = "https://corsproxy.io?";

        // Exakte und vollständige M3U8-Adresse für ant1free
        const channels = {
            ant1: "https://antenna.gr",
            mega: "https://megatv.com",
            ant1free: "https://antennaplus.gr"
        };

        let hlsInstance = null;

        function loadChannel(channelKey) {
            // 1. Visuelles Update der Buttons
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            const activeButton = document.getElementById(`btn-${channelKey}`);
            if (activeButton) {
                activeButton.classList.add('active');
            }

            const targetUrl = channels[channelKey];
            const iframe = document.getElementById('tvframe');
            const video = document.getElementById('tvvideo');

            if (!targetUrl) return;

            // 2. Modus-Unterscheidung: Stream-Modus vs. Webseiten-Modus
            if (channelKey === 'ant1free') {
                iframe.style.display = 'none';
                iframe.src = ''; 
                video.style.display = 'block';

                if (hlsInstance) {
                    hlsInstance.destroy();
                }

                // Der intelligente Proxy bindet sich vor die Stream-URL
                const proxiedStreamUrl = streamProxy + encodeURIComponent(targetUrl);

                if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                    hlsInstance = new Hls({
                        // Sorgt dafür, dass auch alle Unter-Playlists und TS-Segmente über den CORS-Proxy geladen werden
                        xhrSetup: function (xhr, url) {
                            if (url.includes('antennaplus.gr') && !url.includes('corsproxy.io')) {
                                xhr.open('GET', streamProxy + encodeURIComponent(url), true);
                            }
                        }
                    });
                    hlsInstance.loadSource(proxiedStreamUrl);
                    hlsInstance.attachMedia(video);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play().catch(e => console.log("Autoplay blockiert:", e));
                    });
                } 
                // Native Unterstützung für Apple Safari (iOS / Mac)
                else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = proxiedStreamUrl;
                    video.addEventListener('loadedmetadata', function() {
                        video.play().catch(e => console.log("Autoplay blockiert:", e));
                    });
                }
            } else {
                // Webseiten-Modus: Über deine funktionierende proxy.js laufen lassen
                if (hlsInstance) {
                    hlsInstance.destroy();
                    hlsInstance = null;
                }
                video.pause();
                video.src = '';
                video.style.display = 'none';
                
                iframe.style.display = 'block';
                iframe.src = proxyPrefix + encodeURIComponent(targetUrl);
            }
        }
    </script>
</body>
</html>
