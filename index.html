<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Griechisches Live TV – Proxy Modus</title>
    <!-- Hls.js Bibliothek für M3U8-Streaming im Browser laden -->
    <script src="https://jsdelivr.net"></script>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }

        .menu {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: #0056b3;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover, .btn:focus {
            background: #007bff;
            outline: 3px solid #fff;
        }

        .btn.active {
            background: #28a745;
        }

        /* Gemeinsame Größen für Player und Iframe */
        iframe, video {
            width: 95%;
            height: 80vh;
            border: none;
            background: black;
            border-radius: 8px;
        }

        /* Startkonfiguration: Videoplayer verstecken */
        #tvvideo {
            display: none;
            height: auto;
            max-width: 1280px;
        }
    </style>
</head>
<body>

    <div class="menu">
        <button class="btn" id="btn-ant1" onclick="loadChannel('ant1')">ANT1 HD</button>
        <button class="btn" id="btn-mega" onclick="loadChannel('mega')">MEGA Life</button>
        <!-- Neuer Button für den direkten M3U8 IPTV-Stream -->
        <button class="btn" id="btn-ant1free" onclick="loadChannel('ant1free')">Ant1free</button>
    </div>

    <!-- Container für Webseiten-Modus -->
    <iframe id="tvframe"></iframe>

    <!-- Container für direkten M3U8-Stream-Modus -->
    <video id="tvvideo" controls autoplay muted></video>

    <script>
        // Dynamischer Proxy-Prefix passend zu deiner Vercel-Domain
        const proxyPrefix = window.location.origin + "/api/proxy?url=";

        // Offizielle Webseiten und Direkt-Streams
        const channels = {
            ant1: "https://antenna.gr",
            mega: "https://megatv.com",
            ant1free: "https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1.m3u8"
        };

        let hlsInstance = null;

        function loadChannel(channelKey) {
            // 1. Buttons aktualisieren
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            const activeButton = document.getElementById(`btn-${channelKey}`);
            if (activeButton) {
                activeButton.classList.add('active');
            }

            const targetUrl = channels[channelKey];
            const iframe = document.getElementById('tvframe');
            const video = document.getElementById('tvvideo');

            if (!targetUrl) return;

            // Proxied URL erstellen
            const proxiedUrl = proxyPrefix + encodeURIComponent(targetUrl);

            // 2. Modus-Unterscheidung: M3U8-Stream vs. normale Webseite
            if (channelKey === 'ant1free') {
                // Iframe verstecken, Video-Player anzeigen
                iframe.style.display = 'none';
                iframe.src = ''; 
                video.style.display = 'block';

                // Bestehenden Stream stoppen, falls aktiv
                if (hlsInstance) {
                    hlsInstance.destroy();
                }

                // HLS Stream im Player initialisieren
                if (Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(proxiedUrl);
                    hlsInstance.attachMedia(video);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play().catch(e => console.log("Autoplay blockiert:", e));
                    });
                } 
                // Native Unterstützung für Safari (iOS / Mac)
                else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = proxiedUrl;
                    video.addEventListener('loadedmetadata', function() {
                        video.play().catch(e => console.log("Autoplay blockiert:", e));
                    });
                }
            } else {
                // Webseiten-Modus (ant1 / mega): Video-Player stoppen & verstecken, Iframe anzeigen
                if (hlsInstance) {
                    hlsInstance.destroy();
                    hlsInstance = null;
                }
                video.pause();
                video.src = '';
                video.style.display = 'none';
                
                iframe.style.display = 'block';
                iframe.src = proxiedUrl;
            }
        }
    </script>
</body>
</html>
