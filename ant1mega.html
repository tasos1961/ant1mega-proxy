<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Griechisches Live TV</title>

    <!-- HLS.js für Browser & Smart TVs -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body { 
            margin: 0; 
            background: #111; 
            color: white;
            font-family: Arial, sans-serif;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: flex-start; 
            height: 100vh; 
            padding-top: 20px;
        }

        .menu {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
        }

        .btn {
            background: #0056b3;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover, .btn:focus {
            background: #007bff;
            outline: 3px solid #fff;
        }

        .btn.active {
            background: #28a745;
        }

        video { 
            width: 90%; 
            max-width: 1024px; 
            background: black;
            box-shadow: 0px 4px 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="menu">
        <button class="btn" id="btn-ant1" onclick="playChannel('ant1')">ANT1 HD</button>
        <button class="btn" id="btn-mega" onclick="playChannel('mega')">MEGA Life</button>
    </div>

    <video id="video" controls autoplay playsinline></video>

    <script>
        const video = document.getElementById('video');
        let hls = null;

        // Offizielle Webseiten (nicht HLS!)
        const channels = {
            ant1: "https://www.antenna.gr/",
            mega: "https://www.megatv.com/live/"
        };

        // Dein eigener Vercel-Proxy
        const proxyPrefix = "https://ant1mega-proxy.vercel.app/proxy?url=";

        function playChannel(channelKey) {
            const originalUrl = channels[channelKey];
            const proxiedUrl = proxyPrefix + encodeURIComponent(originalUrl);

            // Buttons aktualisieren
            document.getElementById('btn-ant1').classList.remove('active');
            document.getElementById('btn-mega').classList.remove('active');
            document.getElementById('btn-' + channelKey).classList.add('active');

            // Alten Stream stoppen
            if (hls) {
                hls.destroy();
            }

            // HLS.js verwenden
            if (Hls.isSupported()) {
                hls = new Hls({
                    lowLatencyMode: true,
                    backBufferLength: 90
                });

                hls.loadSource(proxiedUrl);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(e => console.log("Autoplay blockiert:", e));
                });

                hls.on(Hls.Events.ERROR, function(event, data) {
                    console.error("HLS Fehler:", data);
                });

            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = proxiedUrl;
                video.addEventListener('loadedmetadata', () => video.play());
            }
        }

        // Standard: ANT1 starten
        window.onload = () => playChannel('ant1');
    </script>
</body>
</html>
