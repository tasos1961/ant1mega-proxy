<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Griechisches Live TV – Proxy Modus</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }

        .menu {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
        }

        .btn {
            background: #0056b3;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover, .btn:focus {
            background: #007bff;
            outline: 3px solid #fff;
        }

        .btn.active {
            background: #28a745;
        }

        iframe {
            width: 95%;
            height: 80vh;
            border: none;
            background: black;
        }
    </style>
</head>
<body>

    <div class="menu">
        <button class="btn" id="btn-ant1" onclick="loadChannel('ant1')">ANT1 HD</button>
        <button class="btn" id="btn-mega" onclick="loadChannel('mega')">MEGA Life</button>
    </div>

    <iframe id="tvframe"></iframe>

    <script>
        const proxyPrefix = "https://ant1mega-proxy.vercel.app/proxy?url=";

        const channels = {
            ant1: "https://www.antenna.gr/",
            mega: "https://www.megatv.com/live/"
        };

        function loadChannel(channelKey) {
            // Buttons aktualisieren
            document.getElementById('btn-ant1').classList.remove('active');
            document.getElementById('btn-mega').classList.remove('active');
            document.getElementById('btn-' + channelKey).classList.add('active');

            // Proxy-URL erzeugen
            const url = proxyPrefix + encodeURIComponent(channels[channelKey]);

            // iFrame laden
            document.getElementById('tvframe').src = url;
        }

        // Standard: ANT1 laden
        window.onload = () => loadChannel('ant1');
    </script>

</body>
</html>
